version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(deps)"

    groups:
      gradle-minor-patch:
        patterns:
          - "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    labels:
      - "github-actions"
      - "dependencies"

    commit-message:
      prefix: "ci(deps)"
